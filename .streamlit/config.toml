[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EBF5"
font = "sans serif"

[client]
toolbarMode = "minimal"
# "none": users see a generic message; details go only to the server log (no paths or tracebacks).
showErrorDetails = "none"

[server]
runOnSave = false
maxUploadSize = 512
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
